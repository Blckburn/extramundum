# Полная матрица винрейтов. GDD §4.6, пункт 2: «10 000 симуляций
# на каждую пару архетипов».
#
# Отдельным workflow, а не шагом в CI, по одной причине: 10 000 × 6 пар
# плюс связки и одиночные трейты идут минуты. На каждом пуше это цена
# без выигрыша — сокращённая выборка в CI ловит те же поломки почти
# так же быстро. Ночной прогон нужен там, где сокращённая выборка
# врёт: у пары с винрейтом около границы коридора доверительный
# интервал на 800 боях шире, чем сама граница.
name: Матрица винрейтов

on:
  schedule:
    # Ежедневно в 03:00 UTC.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: Боёв на пару
        default: '10000'
  push:
    paths:
      # Правка чисел баланса или самого движка — единственный повод
      # гонять полную матрицу вне расписания.
      - 'packages/data/balance.json'
      - 'packages/sim/**'
      - 'scripts/winrate-matrix.mjs'

concurrency:
  group: winrate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: 10 000 боёв на пару архетипов
    runs-on: ubuntu-latest
    # Кривая зон считается по девяти сидам роллов (§4.6, пункт 4):
    # проверяемая величина — медиана, и на одном сиде её нет. Счёт боёв
    # на сид поделён, поэтому рост не девятикратный, но запас нужен.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Числа печатаются в лог целиком, включая связки внутри школ
      # и одиночные трейты: «упало/не упало» о балансе не говорит
      # ничего, а таблица говорит, куда смотреть.
      #
      # ОДИН ПРОГОН, А НЕ ДВА. Прежде матрица гонялась второй раз ради
      # `--json`, считая ровно то же самое за ту же цену. С кривой зон
      # на двадцати пяти сидах роллов (§4.6) вторая половина перестала
      # помещаться в отведённое время. `--json-out` пишет отчёт из того
      # же прогона, что печатает лог, — заодно снимая вопрос, совпадают
      # ли числа в логе и в артефакте.
      - name: Матрица
        run: pnpm balance:matrix -- --runs ${{ inputs.runs || '10000' }} --json-out winrate-matrix.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winrate-matrix
          path: winrate-matrix.json
