name: CI

on:
  pull_request:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Значения для проверок, которым нужна валидная конфигурация.
  # Настоящие секреты живут в переменных окружения Render (инвариант 7).
  BETTER_AUTH_SECRET: ci-only-secret-value-at-least-32-chars
  BETTER_AUTH_URL: http://localhost:8787

jobs:
  check:
    name: Линт, типы, тесты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Настоящий Postgres, а не мок: миграции обязаны применяться к живой
    # базе на каждом PR, иначе поломка схемы найдётся только на деплое.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: extramundum
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/extramundum

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Формат
        run: pnpm format:check

      - name: Линт
        run: pnpm lint

      - name: Типы
        run: pnpm typecheck

      - name: Миграции применяются к чистой базе
        run: pnpm db:migrate

      # Интеграционные тесты ходят в настоящий Postgres из services выше.
      # CI=true включает в них проверку, что база действительно доступна:
      # молча пропущенный интеграционный тест — это тест, которого нет.
      - name: Тесты
        run: pnpm test
        env:
          CI: 'true'

      - name: Схема в коде совпадает с применённой
        # Пустой diff означает, что кто-то поменял схему и забыл
        # сгенерировать миграцию.
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain server/drizzle)" ]; then
            echo "::error::Схема изменена, а миграция не сгенерирована. Запусти pnpm db:generate и закоммить результат."
            git status --porcelain server/drizzle
            exit 1
          fi

      # Перенумерация разделов документа молча ломает десятки ссылок
      # в комментариях. Глазами это не ловится, поэтому ловится здесь.
      - name: Ссылки на разделы документов ведут туда, куда написано
        run: node scripts/check-doc-refs.mjs --quiet

      # Пустой assets-src/ — нормальное состояние, скрипт выйдет с нулём.
      # Как только появятся PNG, шаг начнёт проверять размер, прозрачность
      # и вес, не записывая ничего на диск.
      - name: Иконки проходят проверки ART-BIBLE
        run: pnpm assets:check

      - name: Сборка
        run: pnpm build

      - name: Движка и секретов нет в клиентском бандле
        run: pnpm check:bundle

      # Сокращённая выборка: 800 боёв на пару вместо 10 000. Этого хватает,
      # чтобы поймать поломку баланса на PR за десяток секунд; полная
      # матрица §4.6 гоняется отдельным workflow (winrate-matrix.yml),
      # потому что 10 000 × 6 занимают минуты и на каждом пуше не нужны.
      #
      # Порог здесь ТОТ ЖЕ, 35–65%. Ослабить его для быстрой проверки
      # означало бы зелёный PR при красной ночной сборке.
      - name: Матрица винрейтов, сокращённая выборка
        run: pnpm balance:matrix -- --runs 800

      # Печатает цифры: материалы, вызовы отрисовки, байты на кадр,
      # размер бандла без three.js. Падает при нарушении.
      #
      # Живого браузера здесь нет и не будет: FPS на мобильном
      # и первый кадр на 4G этим шагом НЕ проверяются, и он этого
      # не утверждает. Живой замер — pnpm render:probe, локально.
      - name: Бюджеты рендера
        run: pnpm render:budget
