<!--
  EXTRA MUNDUM. Placeholder icons, v2.
  Vector silhouettes. Replaced by woodcut raster art per docs/ART-BIBLE.md.

  Usage:  <svg class="icon"><use href="#i-weapon-sword"/></svg>

  Colours come from palette variables. Define once in CSS from packages/data/palette.json:
    pal-bone   bone, parchment
    pal-ash    ash, dull pewter
    pal-ochre  ochre, leather and wood
    pal-blood  dried red
    pal-bile   swamp green, bilious
    pal-ink    ink black (outline)

  Munda gold is deliberately absent: reserved for city-origin items per ART-BIBLE section 3.

  viewBox 0 0 32 32. Outline 2px.

  v2 changes: no double hyphens anywhere (valid XML); chill uses a dedicated
  stroke class instead of the fill-none class; bleed, burn, fury, stun and
  enrage redrawn with distinct silhouettes so they differ by shape, not colour.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      symbol * { stroke: var(--pal-ink, #0d0b0a); stroke-width: 2; stroke-linejoin: miter; }
      .m { fill: var(--pal-ash, #8a8578); }
      .w { fill: var(--pal-ochre, #8a6a3d); }
      .b { fill: var(--pal-bone, #ddd6c4); }
      .r { fill: var(--pal-blood, #7d2a25); }
      .g { fill: var(--pal-bile, #5d6b3a); }
      .n { fill: none; }
      .line { fill: none; stroke: var(--pal-bone, #ddd6c4); stroke-width: 2.5; }
      .lineR { fill: none; stroke: var(--pal-blood, #7d2a25); stroke-width: 2.5; }
    </style>
  </defs>

  <!-- WEAPONS, light -->
  <symbol id="i-weapon-dagger" viewBox="0 0 32 32">
    <path class="m" d="M16 3 L20 12 L16 20 L12 12 Z"/>
    <path class="m" d="M9 20 H23 V23 H9 Z"/>
    <path class="w" d="M14 23 H18 V29 H14 Z"/>
  </symbol>
  <symbol id="i-weapon-spear" viewBox="0 0 32 32">
    <path class="m" d="M16 2 L21 10 L16 16 L11 10 Z"/>
    <path class="w" d="M14 16 H18 V30 H14 Z"/>
    <path class="m" d="M11 16 H21 V19 H11 Z"/>
  </symbol>

  <!-- WEAPONS, balanced -->
  <symbol id="i-weapon-sword" viewBox="0 0 32 32">
    <path class="m" d="M16 2 L20 8 V19 H12 V8 Z"/>
    <path class="m" d="M7 19 H25 V23 H7 Z"/>
    <path class="w" d="M14 23 H18 V28 H14 Z"/>
    <circle class="m" cx="16" cy="29" r="2.5"/>
  </symbol>
  <symbol id="i-weapon-mace" viewBox="0 0 32 32">
    <circle class="m" cx="16" cy="9" r="6"/>
    <path class="m" d="M16 1 V4 M16 14 V17 M8 9 H11 M21 9 H24"/>
    <path class="w" d="M14 15 H18 V30 H14 Z"/>
  </symbol>
  <symbol id="i-weapon-flail" viewBox="0 0 32 32">
    <path class="w" d="M6 30 L10 14 H14 L10 30 Z"/>
    <path class="n" d="M12 14 L16 8 L20 7"/>
    <circle class="m" cx="23" cy="8" r="6"/>
    <path class="m" d="M23 1 V3 M23 13 V15 M16 8 H18 M28 8 H30"/>
  </symbol>

  <!-- WEAPONS, heavy -->
  <symbol id="i-weapon-axe" viewBox="0 0 32 32">
    <path class="w" d="M14 4 H18 V30 H14 Z"/>
    <path class="m" d="M18 5 C27 7 28 15 24 19 L18 17 Z"/>
  </symbol>
  <symbol id="i-weapon-hammer" viewBox="0 0 32 32">
    <path class="m" d="M6 5 H26 V14 H6 Z"/>
    <path class="w" d="M14 14 H18 V30 H14 Z"/>
  </symbol>
  <symbol id="i-weapon-greatsword" viewBox="0 0 32 32">
    <path class="m" d="M16 1 L22 9 V20 H10 V9 Z"/>
    <path class="m" d="M4 20 H28 V24 H4 Z"/>
    <path class="w" d="M13 24 H19 V30 H13 Z"/>
  </symbol>
  <symbol id="i-weapon-scythe" viewBox="0 0 32 32">
    <path class="m" d="M4 6 C16 4 26 9 28 16 L22 15 C20 10 13 8 6 10 Z"/>
    <path class="w" d="M8 8 L20 30 H16 L5 10 Z"/>
  </symbol>
  <symbol id="i-weapon-club" viewBox="0 0 32 32">
    <path class="w" d="M11 4 H21 L19 22 H13 Z"/>
    <path class="w" d="M14 22 H18 V30 H14 Z"/>
    <circle class="w" cx="12" cy="10" r="2"/>
    <circle class="w" cx="20" cy="15" r="2"/>
  </symbol>

  <!-- OFFHAND -->
  <symbol id="i-offhand-shield" viewBox="0 0 32 32">
    <path class="m" d="M6 4 H26 V17 C26 24 16 29 16 29 C16 29 6 24 6 17 Z"/>
    <path class="n" d="M16 6 V26 M8 12 H24"/>
  </symbol>
  <symbol id="i-offhand-focus" viewBox="0 0 32 32">
    <circle class="b" cx="16" cy="17" r="8"/>
    <path class="m" d="M12 7 H20 V10 H12 Z"/>
    <path class="n" d="M16 2 V7"/>
    <path class="n" d="M13 15 L16 12 L19 15"/>
  </symbol>

  <!-- ARMOUR -->
  <symbol id="i-armor-helmet" viewBox="0 0 32 32">
    <path class="m" d="M6 16 C6 8 10 4 16 4 C22 4 26 8 26 16 V26 H6 Z"/>
    <path class="r" d="M12 14 H20 V18 H12 Z"/>
    <path class="n" d="M16 18 V26"/>
  </symbol>
  <symbol id="i-armor-chest" viewBox="0 0 32 32">
    <path class="m" d="M8 6 L16 9 L24 6 L27 12 L24 14 V27 H8 V14 L5 12 Z"/>
    <path class="n" d="M16 9 V27"/>
  </symbol>
  <symbol id="i-armor-bracers" viewBox="0 0 32 32">
    <path class="m" d="M8 8 C13 6 19 6 24 8 L22 24 C18 26 14 26 10 24 Z"/>
    <path class="n" d="M9 15 H23"/>
  </symbol>
  <symbol id="i-armor-boots" viewBox="0 0 32 32">
    <path class="w" d="M10 4 H18 V18 C18 20 20 21 24 22 L27 24 V28 H10 Z"/>
    <path class="n" d="M10 24 H27"/>
  </symbol>

  <!-- ACCESSORIES -->
  <symbol id="i-acc-amulet" viewBox="0 0 32 32">
    <path class="n" d="M8 4 C8 14 12 18 16 18 C20 18 24 14 24 4"/>
    <path class="r" d="M16 17 L22 24 L16 30 L10 24 Z"/>
  </symbol>
  <symbol id="i-acc-ring" viewBox="0 0 32 32">
    <circle class="m n" cx="16" cy="19" r="9"/>
    <path class="r" d="M16 3 L21 9 L16 14 L11 9 Z"/>
  </symbol>

  <!-- STATUSES. Each shape reads on its own; colour is secondary. -->

  <!-- bleed: droplet, smooth and round -->
  <symbol id="i-st-bleed" viewBox="0 0 32 32">
    <path class="r" d="M16 3 C16 3 25 15 25 21 C25 26 21 29 16 29 C11 29 7 26 7 21 C7 15 16 3 16 3 Z"/>
  </symbol>

  <!-- poison: flask, unmistakably a vessel -->
  <symbol id="i-st-poison" viewBox="0 0 32 32">
    <path class="g" d="M13 3 H19 V12 L26 25 C27 28 25 30 22 30 H10 C7 30 5 28 6 25 Z"/>
    <path class="n" d="M11 4 H21"/>
    <circle class="n" cx="13" cy="23" r="2"/>
    <circle class="n" cx="19" cy="26" r="1.5"/>
  </symbol>

  <!-- burn: jagged tongues, no rounded droplet body -->
  <symbol id="i-st-burn" viewBox="0 0 32 32">
    <path class="r" d="M9 30 L6 18 L11 21 L10 8 L16 15 L19 2 L23 14 L27 11 L25 22 L29 21 L24 30 Z"/>
  </symbol>

  <!-- stun: broken ring with a gap, not a bolt -->
  <symbol id="i-st-stun" viewBox="0 0 32 32">
    <path class="line" d="M22 7 A11 11 0 1 0 25 17"/>
    <circle class="b" cx="24" cy="5" r="3.5"/>
    <circle class="b" cx="27" cy="19" r="3"/>
    <circle class="b" cx="16" cy="16" r="2.5"/>
  </symbol>

  <!-- hex: hexagon with a cross, unchanged -->
  <symbol id="i-st-hex" viewBox="0 0 32 32">
    <path class="g" d="M16 3 L28 10 V22 L16 29 L4 22 V10 Z"/>
    <path class="n" d="M11 12 L21 22 M21 12 L11 22"/>
  </symbol>

  <!-- fury: three stacked chevrons, linear, nothing like a flame -->
  <symbol id="i-st-fury" viewBox="0 0 32 32">
    <path class="r" d="M16 2 L28 12 H22 L16 7 L10 12 H4 Z"/>
    <path class="r" d="M16 12 L28 22 H22 L16 17 L10 22 H4 Z"/>
    <path class="r" d="M16 21 L28 31 H22 L16 26 L10 31 H4 Z"/>
  </symbol>

  <!-- regen: cross -->
  <symbol id="i-st-regen" viewBox="0 0 32 32">
    <path class="g" d="M13 4 H19 V13 H28 V19 H19 V28 H13 V19 H4 V13 H13 Z"/>
  </symbol>

  <!-- shield: heater shield -->
  <symbol id="i-st-shield" viewBox="0 0 32 32">
    <path class="b" d="M16 3 L27 7 V16 C27 23 16 29 16 29 C16 29 5 23 5 16 V7 Z"/>
  </symbol>

  <!-- enrage: horned skull, unmistakably not a bolt or a flame -->
  <symbol id="i-st-enrage" viewBox="0 0 32 32">
    <path class="r" d="M4 3 L10 9 M28 3 L22 9"/>
    <path class="r" d="M7 15 C7 9 11 6 16 6 C21 6 25 9 25 15 V21 L21 24 V29 H11 V24 L7 21 Z"/>
    <circle class="n" cx="12" cy="16" r="2"/>
    <circle class="n" cx="20" cy="16" r="2"/>
  </symbol>

  <!-- chill: snowflake, drawn with a dedicated stroke class -->
  <symbol id="i-st-chill" viewBox="0 0 32 32">
    <path class="line" d="M16 2 V30 M4 9 L28 23 M28 9 L4 23"/>
    <path class="line" d="M11 5 L16 9 L21 5 M11 27 L16 23 L21 27"/>
    <path class="line" d="M4 15 L9 16 L7 21 M28 15 L23 16 L25 21"/>
  </symbol>
</svg>
