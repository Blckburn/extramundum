<!--
  EXTRA MUNDUM — плейсхолдеры иконок
  Векторные силуэты. Заменяются гравюрными растрами по docs/ART-BIBLE.md,
  когда те появятся. Механизм плейсхолдеров остаётся: игра обязана
  собираться при нуле готовых файлов.

  Использование:  <svg class="icon"><use href="#i-weapon-sword"/></svg>

  Цвета — переменные палитры. Определить один раз в CSS из packages/data/palette.json:
    --pal-bone   кость, пергамент
    --pal-ash    пепел, тусклое олово
    --pal-ochre  охра, кожа и дерево
    --pal-blood  запёкшийся красный
    --pal-bile   болотный, желчный
    --pal-ink    чернильно-чёрный (контур)

  Золото (--pal-gold) НЕ используется: по ART-BIBLE §3 оно зарезервировано
  за вещами из Мунды и назначается поверх, флагом предмета.

  viewBox 0 0 32 32. Контур 2px — «жёсткий чёрный контур» из §2.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <style>
      symbol * { stroke: var(--pal-ink, #0d0b0a); stroke-width: 2; stroke-linejoin: miter; }
      .m { fill: var(--pal-ash, #8a8578); }
      .w { fill: var(--pal-ochre, #8a6a3d); }
      .b { fill: var(--pal-bone, #ddd6c4); }
      .r { fill: var(--pal-blood, #7d2a25); }
      .g { fill: var(--pal-bile, #5d6b3a); }
      .n { fill: none; }
      /* Линейный рисунок: заливки нет, видим сам контур. Без этого
         класса снежинка была невидима — `.n` гасил заливку, а контур
         оставался цветом `--pal-ink`, то есть почти чёрным на почти
         чёрном фоне. */
      .line { fill: none; stroke: var(--pal-bone, #ddd6c4); stroke-linecap: round; }
    </style>
  </defs>

  <!-- ОРУЖИЕ · лёгкое -->
  <symbol id="i-weapon-dagger" viewBox="0 0 32 32">
    <path class="m" d="M16 3 L20 12 L16 20 L12 12 Z"/>
    <path class="m" d="M9 20 H23 V23 H9 Z"/>
    <path class="w" d="M14 23 H18 V29 H14 Z"/>
  </symbol>
