# Инфраструктура как код. Разворачивается через Render Blueprint:
# New -> Blueprint -> указать этот репозиторий.
#
# Значения переменных, помеченных sync: false, Render спросит при первом
# развёртывании. В этом файле их нет и не будет (инвариант 7).

services:
  # ── Сервер ────────────────────────────────────────────────────────
  - type: web
    name: extramundum-server
    runtime: node
    region: frankfurt
    # ВНИМАНИЕ: free засыпает после 15 минут простоя и просыпается
    # десятками секунд. Для M0 это принято сознательно; ADR 0001
    # предполагает starter ($7/мес) — решение об апгрейде отдельное.
    plan: free
    branch: main

    buildCommand: pnpm install --frozen-lockfile && pnpm build

    # Миграции накатываются перед стартом сервера. Правильное место для
    # этого — preDeployCommand, но он недоступен на плане free, поэтому
    # миграция стоит первой в startCommand.
    #
    # Это безопасно: drizzle ведёт журнал применённых миграций и повторный
    # запуск ничего не делает, а `&&` не даст серверу подняться, если
    # схема не накатилась — лучше упасть, чем работать с чужой схемой.
    #
    # Цена: на free сервис засыпает, и при каждом пробуждении выполняется
    # лишний запрос к журналу. При переходе на starter вернуть
    # preDeployCommand — тогда миграции пойдут один раз за деплой.
    # Запускается собранный dist, а не исходник: buildCommand его уже
    # собрал, и в проде незачем полагаться на исполнение TypeScript
    # напрямую.
    startCommand: pnpm --filter @extramundum/server db:migrate:dist && pnpm --filter @extramundum/server start

    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: '8787'

      # Строка РАНТАЙМА: роль extramundum_app, только работа со строками.
      # Pooled (в хосте есть "-pooler"), ADR 0001.
      # Роль заводится в консоли Neon (там управление ролями вынесено
      # в панель), права ей выдаёт server/sql/app-role-grants.sql.
      - key: DATABASE_URL
        sync: false
      # Строка МИГРАЦИЙ: роль-владелец с правами DDL (на Neon это
      # neondb_owner). Используется только командой db:migrate перед
      # стартом и больше нигде. Разделение нужно затем, чтобы ошибка
      # в рантайме не могла снести схему.
      - key: MIGRATE_DATABASE_URL
        sync: false
      # openssl rand -base64 32
      - key: BETTER_AUTH_SECRET
        sync: false
      # Origin ЭТОГО сервиса, без пути. Сейчас
      #   https://bruteforce-server.onrender.com
      #
      # Не адрес клиента и не «клиент плюс /api». Better Auth складывает
      # baseURL и basePath и сопоставляет результат с путём, который видит
      # СЕРВЕР. Статика снимает /api при проксировании, сюда приходит
      # /auth/..., поэтому baseURL обязан быть без пути. С путём вход
      # отвечает 404 — молча, регистрация при этом работает.
      #
      # Путь в этой переменной валит старт сервера, см. src/config.ts.
      - key: BETTER_AUTH_URL
        sync: false
      # Origin клиента, без /api. Сейчас https://bruteforce-web.onrender.com.
      # После перехода на прокси браузер шлёт запросы на свой же домен,
      # так что CORS для него не нужен. Оставлено на случай обращений
      # к серверу напрямую (проверка /health руками, отладка).
      - key: CORS_ORIGINS
        sync: false
      # Известные и принятые ограничения прав роли БД. Не секрет, поэтому
      # значение здесь, а не в панели: решение видно в репозитории.
      #
      # migration-journal — журнал миграций доступен роли рантайма на
      # запись. Роль из консоли Neon приходит с BYPASSRLS, построчная
      # защита её не держит, снять атрибут нельзя (ALTER ROLE отклоняется).
      # Замеры и причина — docs/adr/0002-rls-na-zhurnale.md.
      #
      # Объявленное здесь перестаёт логироваться. mayCreateInPublic
      # и isSuperuser принять нельзя — они кричат всегда.
      - key: DB_PRIVILEGE_EXCEPTIONS
        value: migration-journal

  # ── Клиент ────────────────────────────────────────────────────────
  - type: web
    name: extramundum-web
    runtime: static
    branch: main

    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: apps/web/dist

    routes:
      # ГЛАВНОЕ: /api/* проксируется на сервер, а браузер видит один сайт.
      # Благодаря этому кука сессии — первой стороны, и её не режут
      # браузеры, ужесточающие политику по сторонним кукам.
      # Префикс /api снимается: /api/me на клиенте -> /me на сервере.
      #
      # Правило должно идти ПЕРЕД catch-all ниже: Render применяет
      # первое совпавшее.
      #
      # Адрес сервера здесь литералом — Render не подставляет URL другого
      # сервиса в destination.
      #
      # Хост НЕ совпадает с именем сервиса, и это не опечатка. Render
      # выдаёт адрес .onrender.com при создании сервиса и не меняет его
      # при переименовании: сервис называется extramundum-server, а живёт
      # на bruteforce-server.onrender.com. Менять эту строку на «красивую»
      # нельзя — прокси перестанет находить сервер.
      #
      # Актуальный адрес виден в панели Render на странице сервиса,
      # под его именем.
      - type: rewrite
        source: /api/*
        destination: https://bruteforce-server.onrender.com/*

      # Одностраничное приложение: всё остальное отдаёт index.html.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

    envVars:
      - key: NODE_VERSION
        value: '22'
      # Хеш коммита в метку сборки: её видно в деревне, и она отвечает
      # на вопрос «правка доехала до браузера или я смотрю на старое?».
      # Render подставляет значение сам, значение здесь — только имя.
      - key: RENDER_GIT_COMMIT
        fromService:
          type: web
          name: extramundum-web
          envVarKey: RENDER_GIT_COMMIT
      # VITE_API_URL намеренно НЕ задан: клиент по умолчанию ходит на
      # относительный /api, то есть на свой же домен. Задать абсолютный
      # URL здесь — значит вернуть стороннюю куку и проблему с ней.
